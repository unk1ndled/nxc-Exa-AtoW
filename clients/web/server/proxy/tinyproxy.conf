User tinyproxy
Group tinyproxy

Port 8888
Listen 0.0.0.0
Timeout 600

PidFile "/tmp/tinyproxy.pid"
LogLevel Info

MaxClients 100

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterCaseSensitive No
FilterExtended Yes
FilterURLs Off

# Only allow CONNECT (HTTPS tunnel) to standard web ports.
# Without this, any port — including SSH/SMTP/etc. — would be tunnellable.
ConnectPort 443
ConnectPort 80

# Strip identifying headers from outgoing requests.
DisableViaHeader Yes
